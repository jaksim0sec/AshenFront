<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AshenFront · 병사 작업실</title><link rel="stylesheet" href="src/characters/workshop.css"><link rel="icon" href="data:,"></head><body>
<header><a href="index.html">← 전장</a><h1>병사 작업실</h1><span id="save-state" role="status">이미지 불러오는 중</span><button id="export-all">전체 최종 JSON</button></header>
<main><section id="stage-area"><div class="profile-bar"><img id="faction-flag" alt="국기"><label>국가<select id="nation"></select></label><label>계급<select id="rank"></select></label><button id="unify-physique" title="현재 병사의 머리·몸통·팔·다리 비율을 모든 국가·계급에 적용합니다">체면동화</button><button id="previous">이전</button><button id="next">다음</button></div>
<canvas id="stage" aria-label="캐릭터 파츠 조립 미리보기. 파츠를 선택하고 드래그하여 위치를 조정합니다." tabindex="0"></canvas>
<div class="playbar"><label>동작<select id="animation"><option value="idle">대기 · 호흡</option><option value="walk">보행</option><option value="shoot">조준 · 발사 · 노리쇠</option><option value="hit">피격</option><option value="death">쓰러짐</option></select></label><button id="play">일시정지</button><button id="facing">방향 반전</button><label>조준<input id="aim" type="range" min="-45" max="45" step="1" value="0"></label><label><input type="checkbox" id="guides">손잡이 표시</label></div>
<div class="timeline"><span id="time-label">0.00s</span><input id="time" type="range" min="0" max="1.5" step="0.005" value="0"><label>확대<input id="zoom" type="range" min="0.65" max="2.0" step="0.05" value="1"></label></div><div id="contact-sheet" aria-label="국가 및 계급별 비교"></div>
</section><aside><label>선택 파츠<select id="part"></select></label><label>이미지<select id="asset"></select></label><div class="toggles"><label><input id="visible" type="checkbox">표시</label><label><input id="lock-ratio" type="checkbox" checked disabled>원본 비율 고정</label></div><label><input id="link-head" type="checkbox" checked>머리·모자 함께 이동</label><div id="fields"></div><div class="row"><button id="layer-back">한 겹 뒤로</button><button id="layer-front">한 겹 앞으로</button></div><div class="row"><button id="undo">되돌리기</button><button id="redo">다시 실행</button><button id="reset">이 계급 원본</button></div><div class="row"><button id="complete">조정 완료 · 다음</button><button id="export-one">이 계급 JSON</button></div><label class="file">JSON 다시 불러오기<input type="file" id="import" accept="application/json,.json"></label><div class="row"><button id="apply">전장에 적용</button><button id="clear-local">임시 저장 비우기</button></div><p>새 ZIP에 정의된 조립 좌표와 균일 배율을 적용했습니다. 파츠를 선택한 뒤 드래그하거나 숫자로 조정하세요. 팔은 원본 PNG를 통째로 사용합니다. 체면동화는 현재 체형을 모든 병사에 적용하며 국가별 복장과 계급장은 보존합니다.</p><p>방향키: 1단위 · Shift: 10단위. 조정은 이 브라우저에 저장됩니다. 다른 기기로 옮길 때는 전체 JSON을 내려받으세요. 파츠 회전축은 원본 크롭 이미지 기준 비율입니다.</p><output id="error" role="alert"></output></aside></main>
<script type="module" src="src/characters/workshop.mjs"></script></body></html>
