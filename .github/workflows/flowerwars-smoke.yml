name: FlowerWars Transplant Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original-engine entry and real enemy movement on Node 22
        run: |
          node --check src/fw-entry.mjs
          node --test tests/flowerwars-port.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run full AshenFront regression suite with supported test runner
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Exercise real battlefield UI at mobile and desktop sizes
        run: python tests/flowerwars-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flowerwars-browser-captures
          path: artifacts/flowerwars/
          if-no-files-found: ignore
