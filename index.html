<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#202820"><title>AshenFront · 회색 전선</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,"></head>
<body data-selected="false">
<header><div class="brand">ASHEN<span>FRONT</span><small>회색 전선 · 전술 지휘</small></div><div class="telemetry"><span id="clock">00:00</span><span id="forces">A 40 : 40 B</span></div><a id="soldier-workshop" href="soldier-workshop.html" aria-label="병사 파츠 작업실">병사</a><div class="tools"><button id="pause" aria-label="일시정지">Ⅱ</button><button id="restart" aria-label="새 전투">↻</button></div></header>
<main id="field"><canvas id="battlefield" aria-label="전장. 아군을 선택하고 이동 명령 후 목적지를 터치하세요." tabindex="0"></canvas><div id="objective" aria-live="polite"></div><button id="select-squad" aria-label="분대 선택">분대</button><button id="toggle-map" aria-label="전술 지도 열기">지도</button><div id="view-controls"><button id="zoom-in" aria-label="확대">＋</button><button id="zoom-out" aria-label="축소">−</button><button id="focus-objective" aria-label="목표 지점 보기">◎</button><button id="focus-squad" aria-label="선택 분대 보기">⌖</button></div><canvas id="overview" width="180" height="126" aria-label="전술 지도. 터치하여 카메라 이동" role="img"></canvas><div id="terrain-key"><span>H0 참호</span><span>H1 평지</span><span>H2 능선</span></div><pre id="debug" hidden></pre><div id="result" hidden><h1></h1><p></p><button id="play-again">다시 지휘</button></div></main>
<footer><div id="squad-tabs" aria-label="아군 분대"></div><div class="squad-line"><strong id="squad-name">1 분대</strong><span id="squad-info"></span><label><input id="low-mode" type="checkbox"> 절전</label></div><div class="pressure"><span id="suppression-label">제압 0</span><div><i id="suppression-bar"></i></div></div><div class="commands"><button id="move">이동 <small>M</small></button><button id="hold">대기 <small>H</small></button><button id="rally">집결 <small>R</small></button><button id="withdraw">철수</button><button id="support">지원 <small>2</small></button><button id="cancel" aria-label="명령 모드 취소">✕</button></div><div id="status" role="status">분대 선택 → 이동 → 목적지 터치 · 드래그로 전장 이동</div></footer>
<script type="module" src="src/main.mjs"></script></body></html>
