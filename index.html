<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d2022">
  <title>AshenFront · 회색 전선</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/192.png" type="image/png">
</head>
<body data-selected="false" data-phase="preparation" data-play-mode="deploy">
  <main id="field">
    <canvas id="battlefield" aria-label="전장. 배치할 진형을 고르고 아군 진영을 터치하세요. 드래그로 이동, 두 손가락으로 확대합니다." tabindex="0"></canvas>
    <div id="objective" aria-live="polite"></div>
    <p id="battle-notice" role="status" aria-live="polite">진형을 고르고 아군 진영에 분대를 배치하세요.</p>
    <canvas id="overview" width="180" height="126" aria-label="현재 위치 주변 160×120타일 지도. 터치하여 카메라 이동" role="img"></canvas>
    <div id="command-feedback" hidden aria-hidden="true"></div>
    <div id="terrain-key"><span>H0 참호</span><span>H1 평지</span><span>H2 능선</span></div>
    <div id="result" hidden><small>전투 결과</small><h1></h1><p></p><button id="play-again">다시 지휘</button></div>
  </main>

  <header id="match-hud" aria-label="전투 현황">
    <div class="match-topline"><strong id="match-phase">배치 준비</strong><span id="preparation-clock">01:00</span><span id="clock">00:00</span><span id="forces">A 0 : 40 B</span><div id="faction-ribbon" aria-label="양국 병력"><span class="faction-team arken"><img src="assets/factions/arken/flag.webp" alt=""><b id="army-a">0</b></span><span class="faction-versus">:</span><span class="faction-team velian"><b id="army-b">0</b><img src="assets/factions/velian/flag.webp" alt=""></span></div></div>
    <div class="match-actions"><button id="start-battle">전투 시작</button><button id="match-charge" hidden>전군 진격</button><button id="pause" aria-label="일시정지">Ⅱ</button><button id="restart" aria-label="새 전투">↻</button></div>
  </header>
  <button id="tools-toggle" class="floating-tool" aria-controls="game-tools" aria-expanded="false" aria-label="전장 도구 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1 1-3Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  <button id="toggle-map" class="floating-tool" aria-label="주변 전술 지도 열기">국지 지도</button>

  <section id="deployment-tools" class="is-deploying" aria-label="예비 병력 배치">
    <div class="deployment-head"><div><strong id="deployment-reserve">예비 병력</strong><span>진형 선택 → 아군 진영 터치</span></div><label class="army-size-label" for="army-size">진영당 <select id="army-size" aria-label="진영당 병력 수"><option value="40">40명</option><option value="100">100명</option><option value="200">200명</option><option value="350">350명</option></select></label><button id="auto-deploy">자동 배치</button><button id="deployment-toggle" aria-pressed="true">지휘 모드</button></div>
    <div id="deployment-types" class="deployment-types" role="group" aria-label="배치 진형">
      <button data-deploy-type="line" aria-pressed="true"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M4 8h3v3H4zm7 0h3v3h-3zm7 0h3v3h-3zm7 0h3v3h-3zM4 15h3v3H4zm7 0h3v3h-3zm7 0h3v3h-3zm7 0h3v3h-3z"/></svg><strong>횡대</strong><small>넓은 전열</small></button>
      <button data-deploy-type="column" aria-pressed="false"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M11 2h3v3h-3zm7 0h3v3h-3zM11 9h3v3h-3zm7 0h3v3h-3zm-7 7h3v3h-3zm7 0h3v3h-3z"/></svg><strong>종대</strong><small>좁은 돌파</small></button>
      <button data-deploy-type="square" aria-pressed="false"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M7 3h3v3H7zm7 0h3v3h-3zm7 0h3v3h-3zM7 10h3v3H7zm14 0h3v3h-3zM7 17h3v3H7zm7 0h3v3h-3zm7 0h3v3h-3z"/></svg><strong>방진</strong><small>사방 방어</small></button>
      <button data-deploy-type="spread" aria-pressed="false"><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M3 2h3v3H3zm23 0h3v3h-3zM14 10h3v3h-3zM3 19h3v3H3zm23 0h3v3h-3z"/></svg><strong>산개</strong><small>간격 확보</small></button>
    </div>
  </section>

  <aside id="roster-panel" aria-label="아군 지휘관">
    <div class="roster-tools"><strong>부대 지휘</strong><button id="select-squad" aria-label="분대 선택">분대</button><button id="close-roster" aria-label="편제 닫기">✕</button></div>
    <div id="squad-tabs" aria-label="아군 분대"></div>
  </aside>

  <footer id="command-dock" class="is-expanded" aria-label="선택 부대 지휘">
    <div class="command-selection-row"><div class="squad-line"><strong id="squad-name">분대 지휘</strong><span id="squad-info"></span><div class="pressure"><span id="suppression-label">제압 0</span><div><i id="suppression-bar"></i></div></div></div><button id="orders-toggle" aria-expanded="true" aria-controls="primary-orders selection-actions">명령</button><button id="clear-selection" aria-label="선택 해제">×</button></div>
    <div id="selection-actions" class="selection-actions"><button id="multi-select" aria-pressed="false">＋ 추가 선택</button><button id="selection-platoon">소대 선택</button><button id="selection-locate">부대 보기</button><button id="formation-toggle" aria-expanded="false" aria-controls="formation-panel">진형 ⌄</button></div>
    <div id="primary-orders" class="commands" role="group" aria-label="빠른 명령"><button id="move">이동</button><button id="attack">공격</button><button id="flank">우회</button><button id="hold">사수</button><button id="rally">집결</button></div>
    <div class="command-help"><span id="status" role="status">분대 선택 → 명령 → 목표</span><button id="cancel" aria-label="명령 모드 취소">취소</button></div>
  </footer>

  <section id="formation-panel" aria-label="선택 부대 진형" hidden><div class="formation-heading"><strong>전술 진형</strong><span>상황에 맞춰 전열을 바꾸세요</span></div><div id="formation-controls" aria-label="진형 선택"></div></section>

  <section id="game-tools" aria-label="전장 도구" hidden>
    <strong class="tools-heading">전장 도구</strong>
    <div id="view-controls" role="group" aria-label="카메라"><button id="zoom-in" aria-label="확대">＋</button><button id="zoom-out" aria-label="축소">−</button><button id="focus-objective" aria-label="목표 지점 보기">◎</button><button id="focus-squad" aria-label="선택 분대 보기">⌖</button></div>
    <button id="fit-view">기본 전선 시야</button>
    <div class="tool-actions"><button id="home-view">아군 본진</button><button id="enemy-view">적 본진</button><button id="select-all">전군 선택</button><button id="command-all">전군 진격</button><button id="withdraw">철수</button><button id="support">지원</button></div>
    <label class="low-mode"><input id="low-mode" type="checkbox"> 절전 모드</label><a id="soldier-workshop" href="soldier-workshop.html">병사 파츠 작업실 ↗</a>
    <pre id="debug" hidden></pre>
  </section>
  <script type="module" src="src/boot.mjs"></script>
</body>
</html>
